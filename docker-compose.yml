services:
  backend:
    build: .
    ports:
      - "49175:49175"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: innovationcampus
      POSTGRES_PASSWORD: springserver124@
      POSTGRES_DB: application_db
    ports:
      - "5430:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 60s
      retries: 5

volumes:
  pg_data: